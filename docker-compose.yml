services:
  postgres:
    image: postgres:17
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data

volumes:
  orbit_postgres_data: